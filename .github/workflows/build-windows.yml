name: Build Windows + macOS (VST3, AU, standalone)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a pre-release: creates the tag v<CMake version> on this commit (main only)"
        type: boolean
        default: false
      replace_release:
        description: "With publish_release: replace an existing release of this version (deletes it and its tag first)"
        type: boolean
        default: false

permissions:
  contents: write   # creating GitHub Releases from tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache downloaded dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake -S . -B build -A x64 -DAMPSURD_BUILD_UI_SNAPSHOT=ON

      - name: Build plugin and tools
        run: cmake --build build --config Release --target Ampsurd_VST3 Ampsurd_Standalone recorder_test tone_test ampsurd_render ampsurd_bench limiter_test engine_test gate_tuner_test frankenstein_test ir_test fx_test pitch_test mix_experiment --parallel

      - name: Smoke test (load NAM Core example A2 model, hot-swap stress)
        shell: pwsh
        run: |
          # runs a test; on failure its [FAIL] lines become annotations (readable without the log)
          function Run-Test([string]$exe, [string[]]$testArgs) {
            $out = & $exe @testArgs 2>&1
            $out | Write-Output
            if ($LASTEXITCODE -ne 0) {
              $name = Split-Path $exe -Leaf
              $fails = $out | Select-String -SimpleMatch "FAIL"
              if (-not $fails) { $fails = $out | Select-Object -Last 5 }
              $fails | ForEach-Object { Write-Output "::error title=$name::$_" }
              exit 1
            }
          }
          Run-Test ./build/tools/Release/limiter_test.exe @()
          Run-Test ./build/tools/Release/gate_tuner_test.exe @()
          Run-Test ./build/tools/Release/frankenstein_test.exe @()
          Run-Test ./build/tools/Release/ir_test.exe @()
          Run-Test ./build/tools/Release/fx_test.exe @()
          Run-Test ./build/tools/Release/pitch_test.exe @()
          $env:AMPSURD_FORCE_PLAYER = "1"
          Run-Test ./build/Release/recorder_test.exe @()
          $env:AMPSURD_FORCE_PLAYER = "0"
          Run-Test ./build/Release/tone_test.exe @("build/_deps/namcore-src/example_models/A2.nam", "48000", "128", "12")
          Run-Test ./build/tools/Release/engine_test.exe @("build/_deps/namcore-src/example_models/A2.nam", "build/_deps/namcore-src/example_models/wavenet_a1_standard.nam")
          $m = "build/_deps/namcore-src/example_models/A2.nam"
          ./build/tools/Release/ampsurd_bench.exe $m --stress --seconds 5 build/_deps/namcore-src/example_models/lstm.nam
          ./build/tools/Release/ampsurd_render.exe $m build/_deps/namcore-src/example_audio/input.wav render.wav

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: AMPSURD-VST3-windows-x64
          # upload the parent folder so the zip contains the complete "AMPSURD.vst3" folder
          path: build/plugin/Ampsurd_artefacts/Release/VST3/

      - name: Upload standalone app
        uses: actions/upload-artifact@v4
        with:
          name: AMPSURD-Standalone-windows-x64
          path: build/plugin/Ampsurd_artefacts/Release/Standalone/

      # ---- installer (every build) and GitHub Release (tags v<version>) ----
      # Code signing goes here once the certificate is available (docs/CODE_SIGNING.md): the VST3, the
      # app and then the installer are signed before they are uploaded.
      - name: Installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(AMPSURD VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "AMPSURD_VERSION=$ver" >> $env:GITHUB_ENV
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=$ver" installer\AMPSURD.iss
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=installer::Inno Setup failed"; exit 1 }
          $rel = "build/plugin/Ampsurd_artefacts/Release"
          Compress-Archive -Path "$rel/VST3/AMPSURD.vst3" -DestinationPath "installer/output/AMPSURD-$ver-VST3-windows-x64.zip"
          Compress-Archive -Path "$rel/Standalone/AMPSURD.exe" -DestinationPath "installer/output/AMPSURD-$ver-Standalone-windows-x64.zip"
          Get-ChildItem installer/output

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AMPSURD-Setup-windows-x64
          path: installer/output/*.exe

      - name: Keep the release files (used by the release job)
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: installer/output/*
          retention-days: 3

  macos:
    runs-on: macos-latest   # Apple Silicon runner; the build is universal (arm64 + x86_64)
    steps:
      - uses: actions/checkout@v4

      - name: Cache downloaded dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-macos-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DAMPSURD_BUILD_UI_SNAPSHOT=ON

      - name: Build plugin and tools
        run: cmake --build build --target Ampsurd_VST3 Ampsurd_AU Ampsurd_Standalone recorder_test tone_test ampsurd_render ampsurd_bench limiter_test engine_test gate_tuner_test frankenstein_test ir_test fx_test pitch_test --parallel

      - name: Check the binaries are universal (Apple Silicon + Intel)
        run: |
          set -e
          R=build/plugin/Ampsurd_artefacts/Release
          for f in "$R/Standalone/AMPSURD.app/Contents/MacOS/AMPSURD" "$R/VST3/AMPSURD.vst3/Contents/MacOS/AMPSURD" "$R/AU/AMPSURD.component/Contents/MacOS/AMPSURD"; do
            lipo -info "$f"
            lipo "$f" -verify_arch arm64 x86_64 || { echo "::error title=universal::$f is not universal"; exit 1; }
          done

      - name: Tests (same as on Windows)
        run: |
          set -o pipefail
          run() { local name; name=$(basename "$1"); if ! "$@" 2>&1 | tee out.txt; then grep -F FAIL out.txt | sed "s/^/::error title=$name::/" || tail -5 out.txt | sed "s/^/::error title=$name::/"; exit 1; fi; }
          M=build/_deps/namcore-src/example_models
          run build/tools/limiter_test
          run build/tools/gate_tuner_test
          run build/tools/frankenstein_test
          run build/tools/ir_test
          run build/tools/fx_test
          run build/tools/pitch_test
          AMPSURD_FORCE_PLAYER=1 run build/recorder_test
          run build/tone_test $M/A2.nam 48000 128 12
          run build/tools/engine_test $M/A2.nam $M/wavenet_a1_standard.nam
          build/tools/ampsurd_bench $M/A2.nam --stress --seconds 5 $M/lstm.nam
          build/tools/ampsurd_render $M/A2.nam build/_deps/namcore-src/example_audio/input.wav render.wav
          # the Intel half too (Rosetta 2 on the Apple Silicon runner)
          if arch -x86_64 /usr/bin/true 2>/dev/null; then run arch -x86_64 build/tone_test $M/A2.nam 48000 128 4; fi

      - name: Audio Unit validation (Apple auval)
        run: |
          set -e
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          codesign --force --deep --sign - build/plugin/Ampsurd_artefacts/Release/AU/AMPSURD.component
          cp -R build/plugin/Ampsurd_artefacts/Release/AU/AMPSURD.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -a | grep -i ampsurd || true
          auval -strict -v aumf Amp5 Amps | tee auval.txt
          grep -q "AU VALIDATION SUCCEEDED" auval.txt || { echo "::error title=auval::Audio Unit validation failed"; exit 1; }

      - name: Installer (.pkg) and zips
        run: |
          VER=$(sed -nE 's/^project\(AMPSURD VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          set -o pipefail
          if ! installer/macos/build_pkg.sh "$VER" build/plugin/Ampsurd_artefacts/Release installer/output 2>&1 | tee pkg.txt; then
            tail -15 pkg.txt | sed 's/^/::error title=pkg::/'; exit 1
          fi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AMPSURD-Setup-macOS
          path: installer/output/*.pkg

      - name: Keep the release files (used by the release job)
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: installer/output/*
          retention-days: 3

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: GitHub Release (tag v<version>, or "Run workflow" with publish_release on main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -nE 's/^project\(AMPSURD VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          TAG="v$VER"
          REPO="${{ github.repository }}"
          ls -l dist
          if [[ "${{ github.ref }}" == refs/tags/* && "${{ github.ref_name }}" != "$TAG" ]]; then echo "::error title=release::tag ${{ github.ref_name }} does not match the CMake version $VER"; exit 1; fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.replace_release }}" == "true" ]]; then
              gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes || { echo "::error title=release::could not delete $TAG"; exit 1; }
              sleep 5
            else echo "::error title=release::release $TAG already exists"; exit 1; fi
          fi
          # creates the tag on this commit when it does not exist yet
          gh release create "$TAG" dist/* --repo "$REPO" --target "${{ github.sha }}" --title "AMPSURD $VER (beta)" --notes-file docs/RELEASE_NOTES.md --prerelease \
            || { echo "::error title=release::gh release create failed"; exit 1; }
