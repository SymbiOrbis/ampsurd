name: Build Windows VST3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache downloaded dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build plugin and tools
        run: cmake --build build --config Release --target Ampsurd_VST3 ampsurd_render ampsurd_bench limiter_test engine_test gate_tuner_test frankenstein_test ir_test mix_experiment --parallel

      - name: Smoke test (load NAM Core example A2 model, hot-swap stress)
        shell: pwsh
        run: |
          ./build/tools/Release/limiter_test.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./build/tools/Release/gate_tuner_test.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./build/tools/Release/frankenstein_test.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./build/tools/Release/ir_test.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./build/tools/Release/engine_test.exe build/_deps/namcore-src/example_models/A2.nam build/_deps/namcore-src/example_models/wavenet_a1_standard.nam
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $m = "build/_deps/namcore-src/example_models/A2.nam"
          ./build/tools/Release/ampsurd_bench.exe $m --stress --seconds 5 build/_deps/namcore-src/example_models/lstm.nam
          ./build/tools/Release/ampsurd_render.exe $m build/_deps/namcore-src/example_audio/input.wav render.wav

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: AMPSURD-VST3-windows-x64
          # upload the parent folder so the zip contains the complete "AMPSURD.vst3" folder
          path: build/plugin/Ampsurd_artefacts/Release/VST3/
