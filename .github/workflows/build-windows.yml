name: Build Windows + macOS (VST3, AU, standalone)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a pre-release: creates the tag v<CMake version> on this commit (main only)"
        type: boolean
        default: false
      replace_release:
        description: "With publish_release: replace an existing release of this version (deletes it and its tag first)"
        type: boolean
        default: false

permissions:
  contents: write   # creating GitHub Releases from tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache downloaded dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake -S . -B build -A x64 -DAMPSURD_BUILD_UI_SNAPSHOT=ON

      - name: Build plugin and tools
        run: cmake --build build --config Release --target Ampsurd_VST3 Ampsurd_Standalone recorder_test tone_test ampsurd_render ampsurd_bench limiter_test engine_test gate_tuner_test frankenstein_test ir_test fx_test pitch_test mix_experiment root_test doubler_test cab_ir_test --parallel

      - name: Smoke test (load NAM Core example A2 model, hot-swap stress)
        shell: pwsh
        run: |
          # runs a test; on failure its [FAIL] lines become annotations (readable without the log)
          function Run-Test([string]$exe, [string[]]$testArgs) {
            $out = & $exe @testArgs 2>&1
            $out | Write-Output
            if ($LASTEXITCODE -ne 0) {
              $name = Split-Path $exe -Leaf
              Write-Output "::error title=$name::exit code $LASTEXITCODE"
              $fails = $out | Select-String -SimpleMatch "FAIL"
              if (-not $fails) { $fails = $out | Select-Object -Last 8 }
              $fails | ForEach-Object { Write-Output "::error title=$name::$(($_ -replace '::', ': '))" }
              exit 1
            }
          }
          Run-Test ./build/tools/Release/limiter_test.exe @()
          Run-Test ./build/tools/Release/gate_tuner_test.exe @()
          Run-Test ./build/tools/Release/frankenstein_test.exe @()
          Run-Test ./build/tools/Release/ir_test.exe @()
          Run-Test ./build/tools/Release/fx_test.exe @()
          Run-Test ./build/tools/Release/pitch_test.exe @()
          Run-Test ./build/tools/Release/root_test.exe @()
          Run-Test ./build/tools/Release/doubler_test.exe @()
          Run-Test ./build/tools/Release/cab_ir_test.exe @()
          $env:AMPSURD_FORCE_PLAYER = "1"
          Run-Test ./build/Release/recorder_test.exe @()
          $env:AMPSURD_FORCE_PLAYER = "0"
          Run-Test ./build/Release/tone_test.exe @("build/_deps/namcore-src/example_models/A2.nam", "48000", "128", "12")
          Run-Test ./build/tools/Release/engine_test.exe @("build/_deps/namcore-src/example_models/A2.nam", "build/_deps/namcore-src/example_models/wavenet_a1_standard.nam")
          $m = "build/_deps/namcore-src/example_models/A2.nam"
          Run-Test ./build/tools/Release/ampsurd_bench.exe @($m, "--stress", "--seconds", "5", "build/_deps/namcore-src/example_models/lstm.nam")
          Run-Test ./build/tools/Release/ampsurd_render.exe @($m, "build/_deps/namcore-src/example_audio/input.wav", "render.wav")

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: AMPSURD-VST3-windows-x64
          # upload the parent folder so the zip contains the complete "AMPSURD.vst3" folder
          path: build/plugin/Ampsurd_artefacts/Release/VST3/

      - name: Upload standalone app
        uses: actions/upload-artifact@v4
        with:
          name: AMPSURD-Standalone-windows-x64
          path: build/plugin/Ampsurd_artefacts/Release/Standalone/

      # ---- installer (every build) and GitHub Release (tags v<version>) ----
      # Code signing is NOT done here: the Certum key needs an interactive SimplySign login, so the
      # maintainer signs the published release on his PC (installer/sign_release.ps1, docs/RELEASE_SIGNING.md).
      - name: Installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(AMPSURD VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "AMPSURD_VERSION=$ver" >> $env:GITHUB_ENV
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=$ver" installer\AMPSURD.iss
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=installer::Inno Setup failed"; exit 1 }
          $rel = "build/plugin/Ampsurd_artefacts/Release"
          # fixed names (no version): the website links to .../releases/latest/download/<name>
          Compress-Archive -Path "$rel/VST3/AMPSURD.vst3", "$rel/Standalone/AMPSURD.exe" -DestinationPath "installer/output/AMPSURD-Windows.zip"
          Get-ChildItem installer/output

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AMPSURD-Setup-windows-x64
          path: installer/output/*.exe

      - name: Keep the release files (used by the release job)
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: installer/output/*
          retention-days: 3

  macos:
    runs-on: macos-latest   # Apple Silicon runner; the build is universal (arm64 + x86_64)
    steps:
      - uses: actions/checkout@v4

      - name: Cache downloaded dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-macos-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DAMPSURD_BUILD_UI_SNAPSHOT=ON

      - name: Build plugin and tools
        run: cmake --build build --target Ampsurd_VST3 Ampsurd_AU Ampsurd_Standalone recorder_test tone_test ampsurd_render ampsurd_bench limiter_test engine_test gate_tuner_test frankenstein_test ir_test fx_test pitch_test root_test doubler_test cab_ir_test --parallel

      - name: Check the binaries are universal (Apple Silicon + Intel)
        run: |
          set -e
          R=build/plugin/Ampsurd_artefacts/Release
          for f in "$R/Standalone/AMPSURD.app/Contents/MacOS/AMPSURD" "$R/VST3/AMPSURD.vst3/Contents/MacOS/AMPSURD" "$R/AU/AMPSURD.component/Contents/MacOS/AMPSURD"; do
            lipo -info "$f"
            lipo "$f" -verify_arch arm64 x86_64 || { echo "::error title=universal::$f is not universal"; exit 1; }
            # the Intel half must run on macOS 10.15 Catalina
            minos=$(otool -l -arch x86_64 "$f" | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; exit}')
            echo "x86_64 minimum macOS: $minos"
            [ "$minos" = "10.15" ] || { echo "::error title=catalina::$f needs macOS $minos (expected 10.15)"; exit 1; }
          done

      - name: Tests (same as on Windows)
        run: |
          set -o pipefail
          run() { local name rc; name=$(basename "$1"); rc=0; "$@" > out.txt 2>&1 || rc=$?; cat out.txt; if [ $rc -ne 0 ]; then echo "::error title=$name::exit code $rc"; { grep -F FAIL out.txt || tail -8 out.txt; } | sed 's/::/: /g' | sed "s/^/::error title=$name::/"; exit 1; fi; }
          M=build/_deps/namcore-src/example_models
          run build/tools/limiter_test
          run build/tools/gate_tuner_test
          run build/tools/frankenstein_test
          run build/tools/ir_test
          run build/tools/fx_test
          run build/tools/pitch_test
          run build/tools/root_test
          run build/tools/doubler_test
          run build/tools/cab_ir_test
          AMPSURD_FORCE_PLAYER=1 run build/recorder_test
          run build/tone_test $M/A2.nam 48000 128 12
          run build/tools/engine_test $M/A2.nam $M/wavenet_a1_standard.nam
          run build/tools/ampsurd_bench $M/A2.nam --stress --seconds 5 $M/lstm.nam
          run build/tools/ampsurd_render $M/A2.nam build/_deps/namcore-src/example_audio/input.wav render.wav
          # the Intel half too (Rosetta 2 on the Apple Silicon runner)
          if arch -x86_64 /usr/bin/true 2>/dev/null; then run arch -x86_64 build/tone_test $M/A2.nam 48000 128 4; fi

      - name: Audio Unit validation (Apple auval)
        run: |
          set -e
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          codesign --force --deep --sign - build/plugin/Ampsurd_artefacts/Release/AU/AMPSURD.component
          cp -R build/plugin/Ampsurd_artefacts/Release/AU/AMPSURD.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -a | grep -i ampsurd || true
          auval -strict -v aumf Amp5 Amps | tee auval.txt
          grep -q "AU VALIDATION SUCCEEDED" auval.txt || { echo "::error title=auval::Audio Unit validation failed"; exit 1; }

      - name: Signing identities (Developer ID) into a temporary keychain
        env:
          APP_P12: ${{ secrets.MACOS_DEVID_APP_P12 }}
          INST_P12: ${{ secrets.MACOS_DEVID_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          NOTARY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # forks / pull requests have no secrets: keep the unsigned build (CI does not break)
          if [ -z "$APP_P12" ] || [ -z "$INST_P12" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::notice title=signing::no Apple signing secrets - building the unsigned .pkg"
            exit 0
          fi
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          KC="$RUNNER_TEMP/ampsurd-signing.keychain-db"
          KCPW=$(openssl rand -hex 24)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$APP_P12" | tr -d '\r\n \t' | base64 --decode > "$RUNNER_TEMP/app.p12"
          printf '%s' "$INST_P12" | tr -d '\r\n \t' | base64 --decode > "$RUNNER_TEMP/inst.p12"
          PW=$(trim "$P12_PASSWORD")
          security import "$RUNNER_TEMP/app.p12" -k "$KC" -P "$PW" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          security import "$RUNNER_TEMP/inst.p12" -k "$KC" -P "$PW" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/inst.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          TEAM=$(trim "$TEAM_ID")
          APPID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | grep "($TEAM)" | head -1 | sed -E 's/.*"(.*)"/\1/')
          INSTID=$(security find-identity -v "$KC" | grep "Developer ID Installer" | grep "($TEAM)" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "Application identity: $APPID"
          echo "Installer identity:   $INSTID"
          [ -n "$APPID" ] || { echo "::error title=signing::no 'Developer ID Application' identity for team $TEAM in the .p12"; exit 1; }
          [ -n "$INSTID" ] || { echo "::error title=signing::no 'Developer ID Installer' identity for team $TEAM in the .p12"; exit 1; }
          {
            echo "AMPSURD_KEYCHAIN=$KC"
            echo "AMPSURD_SIGN_APP=$APPID"
            echo "AMPSURD_SIGN_INSTALLER=$INSTID"
          } >> "$GITHUB_ENV"
          if [ -n "$NOTARY_P8" ] && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER" ]; then
            printf '%s' "$NOTARY_P8" | tr -d '\r\n \t' | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "AMPSURD_NOTARY_KEY=$RUNNER_TEMP/AuthKey.p8"
              echo "AMPSURD_NOTARY_KEY_ID=$(trim "$NOTARY_KEY_ID")"
              echo "AMPSURD_NOTARY_ISSUER=$(trim "$NOTARY_ISSUER")"
            } >> "$GITHUB_ENV"
          else
            echo "::warning title=signing::no notarization key - the build will be signed but not notarized"
          fi

      - name: Installer (.pkg) and zips (signed + notarized when the secrets exist)
        run: |
          VER=$(sed -nE 's/^project\(AMPSURD VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          set -o pipefail
          if ! installer/macos/build_pkg.sh "$VER" build/plugin/Ampsurd_artefacts/Release installer/output 2>&1 | tee pkg.txt; then
            grep -E "::error" pkg.txt || tail -15 pkg.txt | sed 's/::/: /g' | sed 's/^/::error title=pkg::/'; exit 1
          fi
          echo "macOS build: $(cat installer/output/macos-signing.txt)"
          echo "::notice title=macOS build::$(cat installer/output/macos-signing.txt)"
          mv installer/output/macos-signing.txt .   # not a release file

      - name: Remove the temporary keychain and keys
        if: always()
        run: |
          if [ -n "${AMPSURD_KEYCHAIN:-}" ]; then security delete-keychain "$AMPSURD_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/inst.p12"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AMPSURD-Setup-macOS
          path: installer/output/*.pkg

      - name: Keep the release files (used by the release job)
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: installer/output/*
          retention-days: 3

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: GitHub Release (tag v<version>, or "Run workflow" with publish_release on main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -nE 's/^project\(AMPSURD VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          TAG="v$VER"
          REPO="${{ github.repository }}"
          ls -l dist
          if [[ "${{ github.ref }}" == refs/tags/* && "${{ github.ref_name }}" != "$TAG" ]]; then echo "::error title=release::tag ${{ github.ref_name }} does not match the CMake version $VER"; exit 1; fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.replace_release }}" == "true" ]]; then
              gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes || { echo "::error title=release::could not delete $TAG"; exit 1; }
              sleep 5
            else echo "::error title=release::release $TAG already exists"; exit 1; fi
          fi
          # creates the tag on this commit when it does not exist yet
          # a normal release (not a pre-release), so .../releases/latest/download/<name> always finds the newest one;
          # "beta" stays in the title and the notes
          gh release create "$TAG" dist/* --repo "$REPO" --target "${{ github.sha }}" --title "AMPSURD $VER (beta)" --notes-file docs/RELEASE_NOTES.md --latest \
            || { echo "::error title=release::gh release create failed"; exit 1; }
