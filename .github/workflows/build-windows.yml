name: Build Windows (VST3 + standalone)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a pre-release: creates the tag v<CMake version> on this commit (main only)"
        type: boolean
        default: false
      replace_release:
        description: "With publish_release: replace an existing release of this version (deletes it and its tag first)"
        type: boolean
        default: false

permissions:
  contents: write   # creating GitHub Releases from tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache downloaded dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake -S . -B build -A x64 -DAMPSURD_BUILD_UI_SNAPSHOT=ON

      - name: Build plugin and tools
        run: cmake --build build --config Release --target Ampsurd_VST3 Ampsurd_Standalone recorder_test tone_test ampsurd_render ampsurd_bench limiter_test engine_test gate_tuner_test frankenstein_test ir_test fx_test pitch_test mix_experiment --parallel

      - name: Smoke test (load NAM Core example A2 model, hot-swap stress)
        shell: pwsh
        run: |
          # runs a test; on failure its [FAIL] lines become annotations (readable without the log)
          function Run-Test([string]$exe, [string[]]$testArgs) {
            $out = & $exe @testArgs 2>&1
            $out | Write-Output
            if ($LASTEXITCODE -ne 0) {
              $name = Split-Path $exe -Leaf
              $fails = $out | Select-String -SimpleMatch "FAIL"
              if (-not $fails) { $fails = $out | Select-Object -Last 5 }
              $fails | ForEach-Object { Write-Output "::error title=$name::$_" }
              exit 1
            }
          }
          Run-Test ./build/tools/Release/limiter_test.exe @()
          Run-Test ./build/tools/Release/gate_tuner_test.exe @()
          Run-Test ./build/tools/Release/frankenstein_test.exe @()
          Run-Test ./build/tools/Release/ir_test.exe @()
          Run-Test ./build/tools/Release/fx_test.exe @()
          Run-Test ./build/tools/Release/pitch_test.exe @()
          $env:AMPSURD_FORCE_PLAYER = "1"
          Run-Test ./build/Release/recorder_test.exe @()
          $env:AMPSURD_FORCE_PLAYER = "0"
          Run-Test ./build/Release/tone_test.exe @("build/_deps/namcore-src/example_models/A2.nam", "48000", "128", "12")
          Run-Test ./build/tools/Release/engine_test.exe @("build/_deps/namcore-src/example_models/A2.nam", "build/_deps/namcore-src/example_models/wavenet_a1_standard.nam")
          $m = "build/_deps/namcore-src/example_models/A2.nam"
          ./build/tools/Release/ampsurd_bench.exe $m --stress --seconds 5 build/_deps/namcore-src/example_models/lstm.nam
          ./build/tools/Release/ampsurd_render.exe $m build/_deps/namcore-src/example_audio/input.wav render.wav

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: AMPSURD-VST3-windows-x64
          # upload the parent folder so the zip contains the complete "AMPSURD.vst3" folder
          path: build/plugin/Ampsurd_artefacts/Release/VST3/

      - name: Upload standalone app
        uses: actions/upload-artifact@v4
        with:
          name: AMPSURD-Standalone-windows-x64
          path: build/plugin/Ampsurd_artefacts/Release/Standalone/

      # ---- installer (every build) and GitHub Release (tags v<version>) ----
      # Code signing goes here once the certificate is available (docs/CODE_SIGNING.md): the VST3, the
      # app and then the installer are signed before they are uploaded.
      - name: Installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(AMPSURD VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "AMPSURD_VERSION=$ver" >> $env:GITHUB_ENV
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=$ver" installer\AMPSURD.iss
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=installer::Inno Setup failed"; exit 1 }
          $rel = "build/plugin/Ampsurd_artefacts/Release"
          Compress-Archive -Path "$rel/VST3/AMPSURD.vst3" -DestinationPath "installer/output/AMPSURD-$ver-VST3-windows-x64.zip"
          Compress-Archive -Path "$rel/Standalone/AMPSURD.exe" -DestinationPath "installer/output/AMPSURD-$ver-Standalone-windows-x64.zip"
          Get-ChildItem installer/output

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AMPSURD-Setup-windows-x64
          path: installer/output/*.exe

      - name: GitHub Release (tag v<version>, or "Run workflow" with publish_release on main)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:AMPSURD_VERSION"
          if ("${{ github.ref }}".StartsWith("refs/tags/") -and "${{ github.ref_name }}" -ne $tag) { Write-Output "::error title=release::tag ${{ github.ref_name }} does not match the CMake version $env:AMPSURD_VERSION"; exit 1 }
          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.replace_release }}" -eq "true") {
              gh release delete $tag --repo "${{ github.repository }}" --cleanup-tag --yes
              if ($LASTEXITCODE -ne 0) { Write-Output "::error title=release::could not delete $tag"; exit 1 }
              Start-Sleep -Seconds 5
            } else { Write-Output "::error title=release::release $tag already exists"; exit 1 }
          }
          # creates the tag on this commit when it does not exist yet
          gh release create $tag (Get-ChildItem installer/output/*).FullName --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "AMPSURD $env:AMPSURD_VERSION (beta)" --notes-file docs/RELEASE_NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=release::gh release create failed"; exit 1 }
